name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sevazimov/catty-reminders-app

jobs:
  tests:
    name: Run tests and build image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Start application stack
        env:
          BUILD_DEPLOY_REF: ${{ github.sha }}
        run: docker compose up --detach --build --wait --wait-timeout 120

      - name: Run all tests and create report
        run: python -m pytest -q --junitxml=test_result.xml

      - name: Stop application stack
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test_result
          path: test_result.xml
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            DEPLOY_REF=${{ github.sha }}
