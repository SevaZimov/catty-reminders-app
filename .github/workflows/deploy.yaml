name: CD

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  SSH_HOST: course.prafdin.space
  SSH_PORT: "3144"
  SSH_USER: seva
  IMAGE_NAME: ghcr.io/sevazimov/catty-reminders-app
  REMOTE_DEPLOY_DIR: /home/seva/.local/share/catty-reminders-app

jobs:
  deploy:
    name: Deploy with Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Check out released commit
        uses: actions/checkout@v7

      - name: Prepare deployment variables
        run: |
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid deployment SHA: $GITHUB_SHA" >&2
            exit 1
          fi

          echo "DEPLOY_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "IMAGE_REF=$IMAGE_NAME:$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "REMOTE_COMPOSE_FILE=$REMOTE_DEPLOY_DIR/docker-compose.yaml" >> "$GITHUB_ENV"

      - name: Prepare SSH connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY"

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/github_actions"

          chmod 600 "$HOME/.ssh/github_actions"

          ssh-keyscan \
            -T 10 \
            -p "$SSH_PORT" \
            -H "$SSH_HOST" \
            >> "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy Docker Compose configuration
        run: |
          ssh \
            -p "$SSH_PORT" \
            -i "$HOME/.ssh/github_actions" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" \
            "install -d -m 700 '$REMOTE_DEPLOY_DIR'"

          ssh \
            -p "$SSH_PORT" \
            -i "$HOME/.ssh/github_actions" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" \
            "cat > '$REMOTE_COMPOSE_FILE' && chmod 600 '$REMOTE_COMPOSE_FILE'" \
            < docker-compose.yaml

      - name: Deploy application
        run: |
          ssh \
            -p "$SSH_PORT" \
            -i "$HOME/.ssh/github_actions" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" \
            "bash -s -- '$DEPLOY_SHA' '$IMAGE_REF' '$REMOTE_COMPOSE_FILE'" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          DEPLOY_SHA="$1"
          IMAGE_REF="$2"
          COMPOSE_FILE="$3"

          EXPECTED_IMAGE="ghcr.io/sevazimov/catty-reminders-app:$DEPLOY_SHA"

          if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid deployment SHA: $DEPLOY_SHA" >&2
              exit 1
          fi

          if [[ "$IMAGE_REF" != "$EXPECTED_IMAGE" ]]; then
              echo "Unexpected image reference: $IMAGE_REF" >&2
              exit 1
          fi

          if [[ "$COMPOSE_FILE" != "/home/seva/.local/share/catty-reminders-app/docker-compose.yaml" ]]; then
              echo "Unexpected Compose file path: $COMPOSE_FILE" >&2
              exit 1
          fi

          export IMAGE_REF
          export DEPLOY_REF="$DEPLOY_SHA"

          docker compose --file "$COMPOSE_FILE" pull

          docker rm --force catty-reminders-app 2>/dev/null || true

          docker compose --file "$COMPOSE_FILE" up \
              --detach \
              --no-build \
              --remove-orphans \
              --wait \
              --wait-timeout 120

          for _ in {1..15}; do
              PAGE="$(
                  curl --silent --fail --location \
                    http://127.0.0.1:8181/login || true
              )"

              if [[ "$PAGE" == *"content=\"$DEPLOY_SHA\""* ]]; then
                  echo "Deploy completed: $IMAGE_REF"
                  docker compose --file "$COMPOSE_FILE" ps
                  exit 0
              fi

              sleep 1
          done

          echo "Application returned an unexpected deployref" >&2
          docker compose --file "$COMPOSE_FILE" logs --tail 100 >&2 || true
          exit 1
          REMOTE_SCRIPT

      - name: Remove SSH private key
        if: always()
        run: rm -f "$HOME/.ssh/github_actions"
