name: catty-reminders

services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: mypass
      MARIADB_DATABASE: catty_reminders
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${IMAGE_REF:-catty-reminders-app:lab4}
    build:
      context: .
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      DEPLOY_REF: ${DEPLOY_REF:-local}
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8181/login', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
volumes:
  database-data:
